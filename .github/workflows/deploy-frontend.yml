name: Deploy Frontend (dev)

on:
  push:
    branches: [ "dev" ]

permissions:
  id-token: write # OIDC를 사용하여 AWS 자격 증명을 얻기 위해 필요
  contents: read # 레포지토리 코드를 체크아웃하기 위해 필요

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET_NAME: stay-stylish-frontend-dev-ljh # 사용자가 생성한 S3 버킷 이름
  # CLOUDFRONT_DISTRIBUTION_ID: # CloudFront 배포 ID (나중에 추가 예정)

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend-dev
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_ID }}:role/github-oidc-role # 백엔드와 동일한 OIDC 역할 사용
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 프로젝트에 맞는 Node.js 버전으로 변경
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        run: pnpm build # Next.js 빌드 명령. 정적 export를 사용하는 경우 'pnpm next export' 또는 'pnpm build && pnpm next export'가 될 수 있습니다.

      - name: Upload to S3
        # Next.js의 정적 빌드 결과물은 일반적으로 'out' 폴더에 생성됩니다.
        # 만약 'out' 폴더가 아닌 다른 곳에 생성된다면 경로를 수정해야 합니다.
        run: aws s3 sync ./out s3://${{ env.S3_BUCKET_NAME }} --delete

      # - name: Invalidate CloudFront cache # CloudFront 설정 후 주석 해제 및 CLOUDFRONT_DISTRIBUTION_ID 설정 필요
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
      #       --paths "/*"
